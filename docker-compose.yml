services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kontexto
    restart: unless-stopped

  kontexto:
    build: .
    expose:
      - "8080"
    volumes:
      - kontexto-data:/app/data
    environment:
      - KONTEXTO_DATA_DIR=/app/data
      - TZ=Europe/Berlin
      # Analytics & admin dashboard. Set these in your environment / .env file.
      # KONTEXTO_SERVER_SECRET: random secret for all analytics HMACs (fingerprint salt, tokens).
      # KONTEXTO_ADMIN_TOTP_SECRET: base32 TOTP secret stored in 1Password (2FA for /admin/stats).
      - KONTEXTO_SERVER_SECRET=${KONTEXTO_SERVER_SECRET:?set KONTEXTO_SERVER_SECRET}
      - KONTEXTO_ADMIN_TOTP_SECRET=${KONTEXTO_ADMIN_TOTP_SECRET:?set KONTEXTO_ADMIN_TOTP_SECRET}
    restart: unless-stopped

volumes:
  kontexto-data:
  caddy-data:
  caddy-config:
