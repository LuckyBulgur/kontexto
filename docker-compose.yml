services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kontexto
    restart: unless-stopped

  kontexto:
    # Production pulls the image CI built for the deployed commit; the deploy
    # writes KONTEXTO_IMAGE_TAG into .env (.github/workflows/deploy.yml), and a
    # rollback is that line set to an older commit. Locally,
    # `docker compose up --build` builds from source and tags it :latest.
    image: ghcr.io/luckybulgur/kontexto:${KONTEXTO_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        # Keep the static export free of ad slots during the AdSense review.
        # Set this to false only after the site has been approved and ads are
        # intentionally being enabled.
        NEXT_PUBLIC_ADSENSE_REVIEW_MODE: ${NEXT_PUBLIC_ADSENSE_REVIEW_MODE:-true}
    expose:
      - "8080"
    volumes:
      - kontexto-data:/app/data
    environment:
      - KONTEXTO_DATA_DIR=/app/data
      - TZ=Europe/Berlin
      # Required: random secret for all HMACs (analytics fingerprint salt, beacon
      # tokens, admin session & WebAuthn challenge tokens). Keep stable forever.
      - KONTEXTO_SERVER_SECRET=${KONTEXTO_SERVER_SECRET:?set KONTEXTO_SERVER_SECRET}
      # Admin /admin/stats is protected by a passkey (WebAuthn). RP id/origin must
      # match the public domain.
      - KONTEXTO_WEBAUTHN_RP_ID=${KONTEXTO_WEBAUTHN_RP_ID:-kontexto.de}
      - KONTEXTO_WEBAUTHN_ORIGIN=${KONTEXTO_WEBAUTHN_ORIGIN:-https://kontexto.de}
      # Break-glass passkey enrollment: leave EMPTY for normal operation
      # (registration disabled). Set a random value only while enrolling/replacing
      # the passkey at /admin/enroll, then clear it again and redeploy.
      - KONTEXTO_ADMIN_ENROLL_TOKEN=${KONTEXTO_ADMIN_ENROLL_TOKEN:-}
      # TikTok chat for /live/ through Euler Stream. Empty disables TikTok only.
      - KONTEXTO_EULER_API_KEY=${KONTEXTO_EULER_API_KEY:-}
      - KONTEXTO_TIKTOK_MAX_ROOMS=${KONTEXTO_TIKTOK_MAX_ROOMS:-20}
      - KONTEXTO_EULER_BUDGET=${KONTEXTO_EULER_BUDGET:-}
      # Twitch app credentials for the badge pictures on /live/. Empty leaves
      # the host page drawing its own icons; the chat itself needs neither.
      - KONTEXTO_TWITCH_CLIENT_ID=${KONTEXTO_TWITCH_CLIENT_ID:-}
      - KONTEXTO_TWITCH_CLIENT_SECRET=${KONTEXTO_TWITCH_CLIENT_SECRET:-}
    restart: unless-stopped

volumes:
  kontexto-data:
  caddy-data:
  caddy-config:
