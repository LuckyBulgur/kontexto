name: CI/CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # test_prepare_integration runs the real data pipeline, which reads word
      # classes with spaCy. The production build uses de_core_news_lg (570 MB,
      # installed by scripts/prepare-data.sh); this job asserts that the
      # pipeline writes its files, not how well it reads German, so it takes
      # the small model and says so through KONTEXTO_SPACY_MODEL below.
      - name: Install the small spaCy model
        run: python -m spacy download de_core_news_sm

      - name: Run tests
        run: python -m pytest backend/ -v
        env:
          PYTHONPATH: backend
          KONTEXTO_SPACY_MODEL: de_core_news_sm

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here. pnpm/action-setup reads the version (with its
      # integrity hash) from the `packageManager` field in package.json.
      # Specifying both triggers ERR_PNPM_BAD_PM_VERSION / a version-mismatch error.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Backend deps are needed to generate the mock dataset and to run the
      # API/WS process that the Playwright webServer boots for the E2E suite.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest)
        working-directory: frontend
        run: pnpm test

      # Same-origin API base as production behind nginx; the build is the primary
      # type-check + static-export gate and produces out/ for seo:check + E2E.
      - name: Build static export
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_ADSENSE_REVIEW_MODE: "true"

      - name: SEO checks
        working-directory: frontend
        run: pnpm seo:check

      - name: Generate E2E mock data
        run: python scripts/create-test-data.py --output data-e2e

      # Cache the ~150 MB Chromium download across runs. Actions cache storage
      # (10 GB/repo, auto-evicted) does NOT count against the Actions storage
      # quota, so this only saves time + bandwidth. Keyed on the resolved
      # Playwright version so a version bump invalidates it automatically.
      - name: Resolve Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # On a cache hit the browser binary is restored but the OS libraries are not
      # (they live on the runner image, not in the cache), so install just those;
      # on a miss, download the browser too.
      - name: Install Playwright browser + OS deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests (Playwright)
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        # Only on failure: a green run's report is never looked at, and artifacts
        # DO count against the Actions storage quota. if-no-files-found=ignore so
        # an earlier failure (e.g. build) that produced no report doesn't error.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/kontexto
            git fetch origin master
            git reset --hard origin/master
            # --force-recreate ensures the running container restarts with the
            # freshly built image (plain `up --build` can leave the old container).
            # Keep the production image review-safe even if an old server .env
            # still contains NEXT_PUBLIC_ADSENSE_REVIEW_MODE=false. This must be
            # changed deliberately after Google has approved the site.
            NEXT_PUBLIC_ADSENSE_REVIEW_MODE=true docker compose up -d --build --force-recreate
            docker image prune -f
            # Cap the BuildKit build cache so it cannot grow unbounded across
            # deploys (every --build adds layers; it had ballooned to ~19 GB).
            # Keeps recent layers warm for fast incremental builds, prunes the
            # oldest beyond 5 GB.
            docker builder prune -f --max-used-space=5GB
            sleep 5
            # Health checks fail the deploy loudly (set -e) if old code is still live.
            curl -fsS http://localhost/api/game > /dev/null
            curl -fsS http://localhost/api/collect/token > /dev/null
            # Public review invariants: the container must serve the new
            # review-safe export, not merely a healthy API behind an old proxy.
            wait_for_status() {
              url="$1"
              expected="$2"
              for attempt in $(seq 1 12); do
                status=$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "$url" || true)
                if [ "$status" = "$expected" ]; then return 0; fi
                sleep 5
              done
              echo "Expected HTTP $expected from $url, got $status" >&2
              return 1
            }
            wait_for_header() {
              url="$1"
              header="$2"
              for attempt in $(seq 1 12); do
                headers=$(curl -sS -D - -o /dev/null "$url" || true)
                if echo "$headers" | grep -Fqi "$header"; then return 0; fi
                sleep 5
              done
              echo "Expected header '$header' from $url" >&2
              return 1
            }
            wait_for_text() {
              url="$1"
              text="$2"
              for attempt in $(seq 1 12); do
                html=$(curl -fsSL "$url" || true)
                if echo "$html" | grep -Fq "$text"; then return 0; fi
                sleep 5
              done
              echo "Expected new review HTML marker '$text' in $url" >&2
              return 1
            }
            wait_for_status https://kontexto.de/ 200
            wait_for_text https://kontexto.de/ 'Kontexto erklärt'
            wait_for_status https://kontexto.de/index.html 301
            wait_for_status https://kontexto.de/faq/index.html 301
            wait_for_status https://kontexto.de/404.html 404
            wait_for_status https://kontexto.de/404/ 404
            wait_for_status https://kontexto.de/_not-found/ 404
            wait_for_header https://kontexto.de/duel/adsense-review-check 'X-Robots-Tag: noindex, nofollow'
            wait_for_status https://kontexto.de/ads.txt 200
            ads_txt=$(curl -fsSL https://kontexto.de/ads.txt)
            if ! echo "$ads_txt" | grep -Fq 'google.com, pub-3545758989514084, DIRECT'; then
              echo 'ads.txt does not declare the Kontexto publisher' >&2
              exit 1
            fi
            sitemap=$(curl -fsSL https://kontexto.de/sitemap.xml)
            sitemap_count=$(echo "$sitemap" | grep -c '<loc>')
            # Twin of expectedStaticSitemapPaths in frontend/scripts/seo-check.mjs.
            # Both are allow-lists so a functional path cannot become an indexed
            # one by accident, and both have to move when a public page is added.
            # This one guards the deployed site, seo:check guards the build.
            # 51 since /live/ was added; the stream chat page is public.
            functional='/(duel|koop|wordle/duel|arena)/create/|/suche/'
            if [ "$sitemap_count" -ne 51 ] || echo "$sitemap" | grep -Eq "$functional"; then
              echo "Unexpected public sitemap: ${sitemap_count} URLs or a functional create URL" >&2
              exit 1
            fi
            home_html=$(curl -fsSL https://kontexto.de/)
            if echo "$home_html" | grep -Fq 'class="adsbygoogle"'; then
              echo 'Review build unexpectedly contains a manual AdSense slot' >&2
              exit 1
            fi
            echo "Deploy successful!"
