name: CI/CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m pytest backend/ -v
        env:
          PYTHONPATH: backend

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/kontexto
            git fetch origin master
            git reset --hard origin/master
            # --force-recreate ensures the running container restarts with the
            # freshly built image (plain `up --build` can leave the old container).
            docker compose up -d --build --force-recreate
            docker image prune -f
            sleep 5
            # Health checks fail the deploy loudly (set -e) if old code is still live.
            curl -fsS http://localhost/api/game > /dev/null
            curl -fsS http://localhost/api/collect/token > /dev/null
            echo "Deploy successful!"
