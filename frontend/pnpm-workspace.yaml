# pnpm settings. As of pnpm 10+, settings such as `overrides` are read from this
# file and no longer from the "pnpm" field in package.json.

# These overrides pin the React type packages to versions matching react@19.2.x
# so transitive deps cannot pull in mismatched @types/react(-dom).
overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3

# pnpm 10+ blocks dependency lifecycle (build) scripts by default as a
# supply-chain safeguard. None of these are needed for our build: the frontend
# is a static export (output: "export"), so next/image never invokes `sharp`;
# `msw` is a test-only service-worker mock; `unrs-resolver` is ESLint's resolver
# and ships prebuilt binaries. We intentionally keep their scripts blocked and
# acknowledge them here so installs stay warning-free.
ignoredBuiltDependencies:
  - msw
  - sharp
  - unrs-resolver

allowBuilds:
  msw: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
