# Welche URLs duerfen nicht in den Index?
#
# Als map und nicht als eigene location, weil ein `add_header` in einer location
# die geerbten Header des server-Blocks nicht ergaenzt, sondern ersetzt: Ein
# eigener Block fuer diese Pfade wuerde CSP, X-Frame-Options und Cache-Control
# stillschweigend abschalten. Ein leerer Wert fuegt keinen Header hinzu, alle
# uebrigen URLs bleiben also unveraendert.
#
# 1. Next legt neben jede Seite ihre RSC-Payload als Klartext ab (index.txt,
#    __next._full.txt, __next._tree.txt, __next.<route>/__PAGE__.txt). Sie
#    tragen den vollstaendigen Seitentext, aber weder Titel noch Canonical.
#    robots.txt sperrt sie bereits; eine per robots gesperrte URL kann Google
#    trotzdem in den Index nehmen, der Header schliesst das aus.
# 2. Geteilte Mehrspieler-Links (/duel/<id>/, /koop/<id>/, /wordle/duel/<id>/)
#    werden serverseitig auf die jeweilige Seite zurueckgefaltet und antworten
#    deshalb fuer jede erfundene Kennung mit 200. Das ist ein Soft-404 ueber
#    einem unbegrenzten URL-Raum. Das Canonical zeigt bereits auf die Basisseite,
#    der Header macht es eindeutig. Die create-Formulare fallen in dasselbe
#    Muster und tragen ihr noindex ohnehin schon im HTML.
# 3. /admin/ ist in robots.txt gesperrt und im HTML noindex, hier zusaetzlich.
# Gemappt wird $request_uri, nicht $uri: add_header wird erst beim Senden der
# Antwort ausgewertet, und da hat try_files $uri laengst umgeschrieben.
# /duel/abc123/ waere dort schon /duel/index.html und keine Regel wuerde
# greifen. $request_uri haelt fest, was der Client wirklich angefragt hat.
map $request_uri $kontexto_robots_tag {
    default                        "";
    "~^/[^?]*index\.txt($|\?)"     "noindex, nofollow";
    "~^/[^?]*__next[^?]*\.txt($|\?)" "noindex, nofollow";
    "~^/duel/[^/]+/"               "noindex, nofollow";
    "~^/koop/[^/]+/"               "noindex, nofollow";
    "~^/wordle/duel/[^/]+/"        "noindex, nofollow";
    "~^/admin/"                    "noindex, nofollow";
}

server {
    listen 8080;
    server_name _;

    root /app/frontend/out;
    index index.html;

    # We sit behind Caddy (TLS terminator). nginx only listens on :8080 over
    # http, so its default absolute redirects leak "http://host:8080/...".
    # Emit relative redirects instead so the client keeps its https scheme/host
    # (fixes trailing-slash redirects for /admin/stats, /wordle, /duel, ...).
    absolute_redirect off;
    port_in_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Leerer Wert = kein Header. Siehe die map oben.
    add_header X-Robots-Tag $kontexto_robots_tag always;
    # CSP widened for Google AdSense (ca-pub-3545758989514084). A static nginx
    # site cannot generate Google's recommended per-request nonce, so ad-relevant
    # directives (script/img/frame/connect) allow https:. default-src stays 'self';
    # object-src/base-uri are hardened.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https:; connect-src 'self' ws: wss: https:; worker-src blob:; object-src 'none'; base-uri 'self'" always;

    # HTML documents must always be revalidated so returning users never get
    # stranded on a stale page after a deploy: the old HTML would reference
    # chunk hashes that no longer exist, the app never hydrates, and the
    # pre-rendered "Laden…" skeleton hangs forever. Hashed assets under
    # /_next/static/ keep their own `immutable` rule (set in that location, so
    # they do not inherit this). Inherited by the HTML-serving locations (which
    # define no add_header of their own) together with the security headers.
    add_header Cache-Control "no-cache" always;

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next's opengraph-image route emits an extensionless PNG file
    # (out/opengraph-image); without an explicit type nginx would serve it as
    # application/octet-stream and social/crawler image fetchers would reject it.
    location = /opengraph-image {
        default_type image/png;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /duel/ {
        try_files $uri $uri/ /duel/index.html;
    }

    # Koop uses dynamic ids (/koop/<id>/) resolved client-side by the single
    # /koop page. Real pages (/koop/, /koop/create/) match $uri first; shared
    # links to a koop id fall back to the koop page.
    location /koop/ {
        try_files $uri $uri/ /koop/index.html;
    }

    # Wördle-Duell uses dynamic ids (/wordle/duel/<id>/) resolved client-side by
    # the single /wordle/duel page. This block MUST precede location /wordle/ in
    # intent (nginx picks the longest prefix match regardless of order) so shared
    # duel links fall back to the duel page, not the single-player /wordle home.
    location /wordle/duel/ {
        try_files $uri $uri/ /wordle/duel/index.html;
    }

    location /wordle/ {
        try_files $uri $uri/ /wordle/index.html;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
